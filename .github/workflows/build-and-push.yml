name: Build & Push Docker Image (manual)

on:
  workflow_dispatch:
    inputs:
      registry:
        description: "Container registry (default: ghcr.io). For Docker Hub use: docker.io"
        required: false
        default: "ghcr.io"
      image_name:
        description: "Image name (default: <owner>/<repo>)"
        required: false
        default: ""
      tag:
        description: "Tag to push (default: latest + short SHA)"
        required: false
        default: ""
      push_latest:
        description: "Also push :latest"
        required: false
        type: boolean
        default: true

env:
  # If image_name input is blank, we use owner/repo
  DEFAULT_IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set vars
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          REGISTRY="${{ inputs.registry }}"
          IMAGE_NAME="${{ inputs.image_name }}"
          TAG_INPUT="${{ inputs.tag }}"
          SHORT_SHA="${GITHUB_SHA::7}"

          if [ -z "$IMAGE_NAME" ]; then
            IMAGE_NAME="${{ env.DEFAULT_IMAGE_NAME }}"
          fi

          # Build tags list
          TAGS=()
          if [ -n "$TAG_INPUT" ]; then
            TAGS+=("${REGISTRY}/${IMAGE_NAME}:${TAG_INPUT}")
          else
            TAGS+=("${REGISTRY}/${IMAGE_NAME}:${SHORT_SHA}")
            if [ "${{ inputs.push_latest }}" = "true" ]; then
              TAGS+=("${REGISTRY}/${IMAGE_NAME}:latest")
            fi
          fi

          # Output multiline tags for build-push-action
          {
            echo "registry=$REGISTRY"
            echo "image_name=$IMAGE_NAME"
            echo "tags<<EOF"
            printf "%s\n" "${TAGS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Login for GHCR using GITHUB_TOKEN
      - name: Log in to GHCR
        if: ${{ steps.vars.outputs.registry == 'ghcr.io' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Login for non-GHCR registries (Docker Hub, private registry, etc.)
      - name: Log in to custom registry
        if: ${{ steps.vars.outputs.registry != 'ghcr.io' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.vars.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
